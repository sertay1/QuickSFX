<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src http://127.0.0.1:8765; media-src https: http: file: blob:;">
  <title>QuickSFX</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">

    <!-- Title bar (drag region) -->
    <header class="titlebar">
      <div class="brand">
        <img class="brand-logo" src="img/logo.png" alt="QuickSFX">
        <span class="brand-name">QuickSFX</span>
        <div class="brand-mark"><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="win-actions">
        <button class="update-badge" id="updateBadge" style="display: none;" title="Yeni sürüm mevcut!">
          <span class="update-dot"></span>
          <span id="updateBadgeText">v1.0.1 Güncelle</span>
        </button>
        <button class="win-btn" id="settingsBtn" title="Settings">
          <!-- Clean Bootstrap gear-fill icon -->
          <svg viewBox="0 0 16 16"><path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872l-.1-.34zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z"/></svg>
        </button>
        <button class="win-btn" id="pinBtn" title="Always on top">
          <svg viewBox="0 0 16 16"><path d="M9.5 1.5l5 5-2 .5-2.5 2.5.5 3-1.5 1.5-3-3L2 15l-1-1 4-4-3-3L3.5 5.5l3 .5L9 3.5z"/></svg>
        </button>
        <button class="win-btn" id="minBtn" title="Minimize">
          <svg viewBox="0 0 16 16"><path d="M3 8.5h10v1H3z"/></svg>
        </button>
        <button class="win-btn close" id="closeBtn" title="Close">
          <svg viewBox="0 0 16 16"><path d="M4.2 3.5L8 7.3l3.8-3.8.7.7L8.7 8l3.8 3.8-.7.7L8 8.7l-3.8 3.8-.7-.7L7.3 8 3.5 4.2z"/></svg>
        </button>
      </div>
    </header>

    <!-- Search -->
    <div class="search">
      <svg class="search-ico" viewBox="0 0 16 16"><path d="M7 2a5 5 0 013.9 8.1l3 3-.8.8-3-3A5 5 0 117 2zm0 1.2a3.8 3.8 0 100 7.6 3.8 3.8 0 000-7.6z"/></svg>
      <input id="q" type="text" placeholder="Search sound effects…" autocomplete="off" spellcheck="false">
      <kbd id="kbdHint">/</kbd>
      <button id="clearQ" class="clear" title="Clear">
        <svg viewBox="0 0 16 16"><path d="M4.2 3.5L8 7.3l3.8-3.8.7.7L8.7 8l3.8 3.8-.7.7L8 8.7l-3.8 3.8-.7-.7L7.3 8 3.5 4.2z"/></svg>
      </button>
    </div>

    <!-- Sources -->
    <div class="sources" id="sources">
      <button class="src on" data-src="pixabay"><i></i>Pixabay</button>
      <button class="src on" data-src="mixkit"><i></i>Mixkit</button>
      <button class="src on" data-src="myinstants"><i></i>Instants</button>
      <button class="src on" data-src="freesound"><i></i>Freesound</button>
    </div>

    <!-- Quick tags (Horizontal Wheel Scrolling) -->
    <div class="tags" id="tags"></div>

    <!-- Results list -->
    <main class="list" id="list"></main>

    <!-- Dedicated Audio Player Bar (2-Row Spacious Deck) -->
    <div class="player-bar" id="playerBar">
      <!-- Row 1: Track Details & Primary Action -->
      <div class="p-main-row">
        <button class="p-play-btn" id="pPlayBtn" title="Play / Pause (Space)">
          <svg class="p-i-play" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>
          <svg class="p-i-pause" viewBox="0 0 16 16"><path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/></svg>
        </button>
        <div class="p-details">
          <div class="p-title" id="pTitle">Start preview</div>
          <div class="p-meta">
            <span class="p-src-tag" id="pSrcTag"></span>
          </div>
        </div>
        <div class="p-actions">
          <button class="p-add-btn" id="pAddBtn" title="Add to Timeline (Enter)">
            <svg viewBox="0 0 16 16"><path d="M7.3 2.5h1.4v4.8h4.8v1.4H8.7v4.8H7.3V8.7H2.5V7.3h4.8z"/></svg>
            <span class="p-add-label" id="pAddLabel">Add</span>
          </button>
        </div>
      </div>

      <!-- Row 2: Transport Tools, Scrubber with Time Labels, and Volume -->
      <div class="p-control-row">
        <div class="p-playback-tools">
          <button class="p-btn" id="pRewindBtn" title="2s Back (←)">
            <svg viewBox="0 0 16 16"><path d="M8 3v3.5L13 3v10l-5-3.5V13L3 8l5-5z"/></svg>
          </button>
          <button class="p-btn" id="pLoopBtn" title="Loop">
            <svg viewBox="0 0 16 16"><path d="M3 5h8a3 3 0 013 3v1h-1.5V8A1.5 1.5 0 0011 6.5H3V9L0 5.75 3 2.5V5zm10 6H5a3 3 0 01-3-3V7h1.5v1A1.5 1.5 0 005 9.5h8V7l3 3.25L13 13.5V11z"/></svg>
          </button>
        </div>

        <div class="p-scrub-group">
          <span class="p-time-label" id="pCurTime">00:00</span>
          <div class="p-seek-wrap" id="pSeekWrap">
            <div class="p-track" id="pTrack">
              <div class="p-progress" id="pProgress"></div>
              <div class="p-thumb" id="pThumb"></div>
            </div>
            <div class="p-tooltip" id="pTooltip">00:00</div>
          </div>
          <span class="p-time-label" id="pTotalTime">00:00</span>
        </div>

        <div class="vol-box" id="volBox" title="Volume (Scroll to adjust)">
          <button class="vol-icon-btn" id="volMuteBtn" title="Mute / Unmute">
            <svg class="vol-i-hi" viewBox="0 0 16 16"><path d="M2 6h2.5L8 3v10L4.5 10H2zM10.5 5.2a4 4 0 010 5.6l-.8-.8a2.8 2.8 0 000-4zM12.5 3.2a7 7 0 010 9.6l-.8-.8a5.8 5.8 0 000-8z"/></svg>
            <svg class="vol-i-mid" viewBox="0 0 16 16"><path d="M2 6h2.5L8 3v10L4.5 10H2zM10.5 5.2a4 4 0 010 5.6l-.8-.8a2.8 2.8 0 000-4z"/></svg>
            <svg class="vol-i-mute" viewBox="0 0 16 16"><path d="M2 6h2.5L8 3v10L4.5 10H2zM13.5 6.5l-1-1L11 7l-1.5-1.5-1 1L10 8l-1.5 1.5 1 1L11 9l1.5 1.5 1-1L12 8z"/></svg>
          </button>
          <div class="vol-slider-wrap">
            <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8">
            <div class="vol-slider-fill" id="volFill"></div>
          </div>
          <span class="vol-pct" id="volPct">80%</span>
        </div>
      </div>
    </div>

    <!-- Status bar -->
    <footer class="statusbar">
      <div class="status" id="status">
        <span class="led" id="led"></span>
        <span class="status-text" id="statusText">Connecting…</span>
      </div>
      <div class="status-right">
        <span class="tc" id="tc"></span>
        <span class="author-tag" id="authorTag" title="QuickSFX by SertAy">by SertAy</span>
      </div>
    </footer>

    <!-- Toast notification -->
    <div class="toast" id="toast"></div>

    <!-- Context menu -->
    <div class="ctx" id="ctx">
      <button data-act="playhead"><span id="mPlayhead">Add at Playhead</span><kbd>↵</kbd></button>
      <button data-act="append"><span id="mAppend">Append to Timeline</span></button>
      <button data-act="pool_only"><span id="mPool">Media Pool only</span></button>
      <hr>
      <button data-act="reveal"><span id="mReveal">Show in Explorer</span></button>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
      <div class="modal-card">
        <div class="modal-head">
          <div class="modal-title" id="sTitle">QuickSFX Settings</div>
          <button class="modal-close" id="settingsCloseBtn" title="Close">
            <svg viewBox="0 0 16 16"><path d="M4.2 3.5L8 7.3l3.8-3.8.7.7L8.7 8l3.8 3.8-.7.7L8 8.7l-3.8 3.8-.7-.7L7.3 8 3.5 4.2z"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <!-- Language -->
          <div class="pref-group">
            <label class="pref-label" id="sLangLabel">Language / Dil</label>
            <div class="pref-buttons" id="langButtons">
              <button class="pref-btn active" data-lang="en">🇬🇧 English</button>
              <button class="pref-btn" data-lang="tr">🇹🇷 Türkçe</button>
            </div>
          </div>

          <!-- Theme -->
          <div class="pref-group">
            <label class="pref-label" id="sThemeLabel">Appearance Theme</label>
            <div class="pref-buttons" id="themeButtons">
              <button class="pref-btn active" data-theme="dark" id="themeDarkBtn">🌙 Dark</button>
              <button class="pref-btn" data-theme="light" id="themeLightBtn">☀️ Light</button>
              <button class="pref-btn" data-theme="auto" id="themeAutoBtn">💻 System</button>
            </div>
          </div>

          <!-- Default Insert Mode -->
          <div class="pref-group">
            <label class="pref-label" id="sInsertLabel">Default Insert Mode</label>
            <div class="pref-buttons" id="insertButtons">
              <button class="pref-btn active" data-mode="playhead" id="insPlayheadBtn">At Playhead</button>
              <button class="pref-btn" data-mode="append" id="insAppendBtn">At Timeline End</button>
              <button class="pref-btn" data-mode="pool_only" id="insPoolBtn">Media Pool</button>
            </div>
          </div>

          <!-- Download Directory -->
          <div class="pref-group">
            <label class="pref-label" id="sFolderLabel">Download Folder</label>
            <div class="pref-folder-row">
              <input type="text" class="pref-input" readonly value="" placeholder="~/Music/QuickSFX" id="folderPathInput">
              <button class="pref-action-btn" id="openFolderBtn">Open Folder</button>
            </div>
          </div>

          <!-- Version & Update -->
          <div class="pref-group">
            <label class="pref-label" id="sVersionLabel">Version & Updates</label>
            <div class="pref-version-card">
              <div class="version-info">
                <span class="version-num" id="versionNum">QuickSFX v1.0.0</span>
                <span class="version-status" id="versionStatus">Up to date</span>
              </div>
              <button class="pref-action-btn" id="checkUpdateBtn">Check for Updates</button>
            </div>
          </div>

          <!-- Shortcuts -->
          <div class="pref-group">
            <label class="pref-label" id="sShortcutsLabel">Keyboard Shortcuts</label>
            <div class="shortcuts-grid" id="shortcutsGrid"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <audio id="audio" preload="none"></audio>
  <script src="renderer.js"></script>
</body>
</html>
